services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cyberguardx-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      frontend_backend:
        gw_priority: 1
    environment:
      DATABASE_URL: "sqlite:////app/data/cyberguardx.db"
      APP_ENV: production
      DEBUG: "False"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env before starting Docker Compose}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ARTIFACT_HMAC_KEY: "${ARTIFACT_HMAC_KEY:-}"
      ALLOW_UNSIGNED_MODELS: "${ALLOW_UNSIGNED_MODELS:-false}"
      LLM_PROVIDER: template_fallback
      TRUSTED_PROXY_CIDRS: '${TRUSTED_PROXY_CIDRS:-[]}'
    volumes:
      - ./backend/saved_models:/app/backend/saved_models
      - cyberguardx_sqlite_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberguardx-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      frontend_backend:
        ipv4_address: 10.254.254.2
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cyberguardx_sqlite_data:
    name: cyberguardx_demo_sqlite_data

networks:
  frontend_backend:
    driver: bridge
    ipam:
      config:
        - subnet: 10.254.254.0/28
          gateway: 10.254.254.1
