services:
  postgres:
    image: postgres:16-alpine
    container_name: cyberguardx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyberguard
      POSTGRES_PASSWORD: cyberguard_secret
      POSTGRES_DB: cyberguardx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberguard -d cyberguardx"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cyberguardx-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://cyberguard:cyberguard_secret@postgres:5432/cyberguardx
      - APP_ENV=production
      - DEBUG=False
      - LLM_PROVIDER=template_fallback
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/saved_models:/app/backend/saved_models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberguardx-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:

