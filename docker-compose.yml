services:
  postgres:
    image: postgres:16-alpine
    container_name: cyberguardx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyberguard
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Docker Compose}"
      POSTGRES_DB: cyberguardx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberguard -d cyberguardx"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cyberguardx-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg2://cyberguard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Docker Compose}@postgres:5432/cyberguardx"
      APP_ENV: production
      DEBUG: "False"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env before starting Docker Compose}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      LLM_PROVIDER: template_fallback
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/saved_models:/app/backend/saved_models
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberguardx-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:

