name: Full Stack CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend Tests & SQLite Migrations
    runs-on: ubuntu-latest
    env:
      CI: "true"
      RAG_BACKEND: "auto"
      DATABASE_URL: sqlite:////tmp/cyberguardx-ci.db
      SECRET_KEY: ci-test-secret-key-please-use-only-for-github-actions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Audit Python dependencies
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt
      - name: Install CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2.0"
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Verify SQLite migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run backend test suite
        run: python -m pytest backend/tests -v

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Build frontend
        working-directory: frontend
        run: npm run build
