name: Full Stack CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend Tests & Postgres Migrations
    runs-on: ubuntu-latest
    env:
      CI: "true"
      RAG_BACKEND: "auto"
      DATABASE_URL: postgresql+psycopg2://cyberguard:cyberguard_test_password@127.0.0.1:5432/cyberguard_test
      SECRET_KEY: ci-test-secret-key-please-use-only-for-github-actions
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyberguard
          POSTGRES_PASSWORD: cyberguard_test_password
          POSTGRES_DB: cyberguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyberguard -d cyberguard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2.0"
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Verify PostgreSQL migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run backend test suite
        run: python -m pytest backend/tests -v

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
